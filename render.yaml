services:
  - type: web
    name: stresslens-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stresslens-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8

databases:
  - name: stresslens-db
    databaseName: stresslens
    user: postgres
    plan: free
