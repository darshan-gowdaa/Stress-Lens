[project]
name = "stresslens-api"
version = "0.1.0"
description = "StressLens Backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]",
    "alembic",
    "asyncpg",
    "celery",
    "redis",
    "scikit-learn",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=6.0.0",
    "mlflow>=3.15.1",
    "bertopic>=0.17.4",
    "numpy>=2.5.2",
    "pandas>=2.3.3",
]
